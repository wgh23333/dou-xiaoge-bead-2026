<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>豆小格拼豆生成器</title>
<style>
:root{--bg:#f5f7fb;--ink:#172033;--muted:#667085;--brand:#2878e8;--line:#e7ebf2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Microsoft Yahei",sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top{max-width:1180px;margin:auto;padding:15px 20px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.logo{font-size:22px;font-weight:850;letter-spacing:.5px}.logo span{color:var(--brand)}
button,.btn{border:0;border-radius:10px;padding:10px 15px;background:var(--brand);color:white;font-weight:700;cursor:pointer}
button.secondary,.btn.secondary{background:#edf3ff;color:#205eb6}button:disabled{opacity:.45;cursor:not-allowed}
main{max-width:1180px;margin:24px auto;padding:0 18px}
.hero{margin-bottom:20px}.hero h1{margin:0 0 5px;font-size:27px}.hero p{color:var(--muted);margin:0}
.layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:18px}
.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 18px #1d35570a}
h2{font-size:17px;margin:0 0 14px}.field{margin:13px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #d8deea;border-radius:9px;background:white;color:var(--ink)}
.field input[type=range]{padding:0}.hint{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.tab{background:#f0f3f8;color:#46536a}.tab.active{background:#e4efff;color:#175dbb}
.drop{border:2px dashed #b9c9e1;border-radius:13px;padding:20px;text-align:center;background:#f8fbff;cursor:pointer}.drop strong{display:block;margin-bottom:4px}
.preview{min-height:400px;display:flex;align-items:center;justify-content:center;background:#f8f9fc;border:1px solid var(--line);border-radius:12px;overflow:auto;padding:14px}
canvas{max-width:100%;height:auto;image-rendering:pixelated}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.stat{background:#f4f7fb;border-radius:10px;padding:9px 13px;font-size:13px}.stat b{font-size:17px;display:block}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:7px;margin-top:12px}.color{display:flex;align-items:center;gap:7px;font-size:12px;background:#f7f8fa;padding:6px;border-radius:8px}.swatch{width:18px;height:18px;border:1px solid #0002;border-radius:4px;flex:none}
footer{text-align:center;color:var(--muted);padding:30px 15px;font-size:13px}
a{color:var(--brand);text-decoration:none}
@media(max-width:800px){.layout{grid-template-columns:1fr}.top{padding:12px 15px}.hero h1{font-size:23px}.preview{min-height:280px}}
</style></head>
<body>
<header><div class="top"><div class="logo">豆小格<span>拼豆生成器</span></div><a class="btn secondary" href="https://www.goofish.com/search?q=wgh23333333" target="_blank" rel="noopener">闲鱼购买卡密</a></div></header>
<main>
<section class="hero"><h1>把喜欢的图片，变成拼豆图纸</h1><p>上传图片或输入文字，调整格子数量，生成可保存的拼豆像素图与颜色统计。</p></section>
<div class="layout">
<aside class="panel">
<h2>创作设置</h2>
<div class="tabs"><button class="tab active" data-mode="image">图片转图纸</button><button class="tab" data-mode="text">文字转图纸</button><button class="tab" data-mode="qr">二维码转图纸</button></div>
<div id="imageMode">
<label class="drop" for="file"><strong>点击或拖拽图片到这里</strong><span class="hint">支持 JPG、PNG、WebP</span></label><input id="file" type="file" accept="image/*" hidden>
</div>
<div id="textMode" hidden>
<div class="field"><label for="words">输入文字</label><textarea id="words" rows="3" placeholder="输入想制作的文字"></textarea></div>
<div class="field"><label for="fontSize">文字大小</label><input id="fontSize" type="range" min="16" max="90" value="48"></div>
</div>
<div id="qrMode" hidden><div class="field"><label for="qrText">二维码内容</label><textarea id="qrText" rows="3" placeholder="输入网址、文字或联系方式"></textarea><p class="hint">二维码生成需要联网加载二维码组件。</p></div></div>
<div class="field"><label for="size">图纸宽度（格）</label><input id="size" type="number" min="8" max="160" value="50"></div>
<div class="field"><label for="limit">颜色上限</label><select id="limit"><option>24</option><option>48</option><option selected>72</option><option>96</option><option>120</option><option>144</option><option>221</option><option>291</option></select></div>
<div class="field"><label for="grid">显示网格</label><select id="grid"><option value="1" selected>显示</option><option value="0">隐藏</option></select></div>
<div class="actions"><button id="make">生成拼豆图纸</button><button class="secondary" id="reset">重置</button></div>
<p class="hint">提示：本页面为浏览器本地处理演示版，图片不会上传到服务器。</p>
</aside>
<section class="panel">
<h2>图纸预览</h2>
<div class="preview" id="preview"><div style="text-align:center;color:#8993a4">上传图片或输入文字后，点击「生成拼豆图纸」</div></div>
<div class="stats"><div class="stat"><b id="beads">0</b>珠子总数</div><div class="stat"><b id="colorsCount">0</b>颜色种类</div><div class="stat"><b id="dimensions">—</b>图纸尺寸</div></div>
<div class="actions"><button id="download" disabled>下载图纸 PNG</button></div>
<h2 style="margin-top:20px">颜色用量统计</h2><div class="colors" id="colors"><span class="hint">生成图纸后显示颜色数量</span></div>
</section></div></main>
<footer>豆小格拼豆生成器 · 图片处理在本地完成 · 卡密购买请通过闲鱼搜索 <b>wgh23333333</b></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $=id=>document.getElementById(id);let mode='image',img=null,canvasOut=null;
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));$('imageMode').hidden=mode!=='image';$('textMode').hidden=mode!=='text';$('qrMode').hidden=mode!=='qr'});
$('file').onchange=e=>loadFile(e.target.files[0]);
function loadFile(f){if(!f)return;if(!f.type.startsWith('image/'))return alert('请选择图片文件');let u=URL.createObjectURL(f);img=new Image();img.onload=()=>{URL.revokeObjectURL(u);$('preview').innerHTML='<span class="hint">图片已载入，点击生成图纸</span>'};img.src=u}
$('make').onclick=()=>{let source=document.createElement('canvas'),ctx=source.getContext('2d'),w,h;
if(mode==='image'){if(!img)return alert('请先上传一张图片');w=img.naturalWidth;h=img.naturalHeight;let max=900,s=Math.min(1,max/Math.max(w,h));source.width=Math.round(w*s);source.height=Math.round(h*s);ctx.drawImage(img,0,0,source.width,source.height)}
else if(mode==='text'){let t=$('words').value.trim();if(!t)return alert('请先输入文字');source.width=Math.max(180,t.length*Number($('fontSize').value));source.height=Number($('fontSize').value)*1.6;ctx.fillStyle='#fff';ctx.fillRect(0,0,source.width,source.height);ctx.fillStyle='#111';ctx.font='bold '+$('fontSize').value+'px sans-serif';ctx.textBaseline='middle';ctx.fillText(t,5,source.height/2)}
else {let t=$('qrText').value.trim();if(!t)return alert('请先输入二维码内容');if(typeof QRCode==='undefined')return alert('二维码组件加载失败，请检查网络后刷新页面');let holder=document.createElement('div');holder.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(holder);new QRCode(holder,{text:t,width:512,height:512,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});setTimeout(()=>{let q=holder.querySelector('canvas');if(!q){let im=holder.querySelector('img');if(!im)return alert('二维码生成失败');let tmp=new Image();tmp.onload=()=>{source.width=tmp.width;source.height=tmp.height;ctx.drawImage(tmp,0,0);holder.remove();makeFromSource(source)};tmp.src=im.src;return}source.width=q.width;source.height=q.height;ctx.drawImage(q,0,0);holder.remove();makeFromSource(source)},150)}
if(mode==='qr')return;
makeFromSource(source)};
function makeFromSource(source){let ctx=source.getContext('2d');let cols=Math.max(8,Math.min(160,Number($('size').value)||50)),rows=Math.max(1,Math.round(cols*source.height/source.width));rows=Math.min(160,rows);
let small=document.createElement('canvas');small.width=cols;small.height=rows;let sc=small.getContext('2d',{willReadFrequently:true});sc.drawImage(source,0,0,cols,rows);let data=sc.getImageData(0,0,cols,rows).data,limit=Number($('limit').value),hist=new Map(),pixels=[];
for(let i=0;i<data.length;i+=4){let a=data[i+3]/255,r=Math.round((data[i]*a+255*(1-a))/32)*32,g=Math.round((data[i+1]*a+255*(1-a))/32)*32,b=Math.round((data[i+2]*a+255*(1-a))/32)*32,key=[Math.min(255,r),Math.min(255,g),Math.min(255,b)].join(',');pixels.push(key);hist.set(key,(hist.get(key)||0)+1)}
let ranked=[...hist].sort((a,b)=>b[1]-a[1]),palette=ranked.slice(0,limit).map(x=>x[0]);let nearest=(key)=>{let p=key.split(',').map(Number),best=palette[0],dist=1e9;for(let k of palette){let q=k.split(',').map(Number),d=(p[0]-q[0])**2+(p[1]-q[1])**2+(p[2]-q[2])**2;if(d<dist){dist=d;best=k}}return best};
let counts=new Map();let out=document.createElement('canvas'),cell=14;out.width=cols*cell;out.height=rows*cell;let oc=out.getContext('2d');for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let k=nearest(pixels[y*cols+x]);counts.set(k,(counts.get(k)||0)+1);oc.fillStyle='rgb('+k+')';oc.fillRect(x*cell,y*cell,cell,cell)}
if($('grid').value==='1'){oc.strokeStyle='rgba(0,0,0,.22)';oc.lineWidth=.6;for(let x=0;x<=cols;x++){oc.beginPath();oc.moveTo(x*cell,0);oc.lineTo(x*cell,out.height);oc.stroke()}for(let y=0;y<=rows;y++){oc.beginPath();oc.moveTo(0,y*cell);oc.lineTo(out.width,y*cell);oc.stroke()}}
canvasOut=out;$('preview').innerHTML='';$('preview').appendChild(out);$('beads').textContent=cols*rows;$('colorsCount').textContent=counts.size;$('dimensions').textContent=cols+' × '+rows;$('download').disabled=false;
$('colors').innerHTML='';[...counts].sort((a,b)=>b[1]-a[1]).forEach(([c,n])=>{let d=document.createElement('div');d.className='color';let s=document.createElement('i');s.className='swatch';s.style.background='rgb('+c+')';let span=document.createElement('span');span.textContent='RGB '+c+' · '+n+'颗';d.append(s,span);$('colors').append(d)})}
$('download').onclick=()=>{if(!canvasOut)return;let a=document.createElement('a');a.download='豆小格-拼豆图纸.png';a.href=canvasOut.toDataURL('image/png');a.click()};
$('reset').onclick=()=>{img=null;canvasOut=null;$('file').value='';$('words').value='';if($('qrText'))$('qrText').value='';$('preview').innerHTML='<div style="text-align:center;color:#8993a4">上传图片或输入文字后，点击「生成拼豆图纸」</div>';$('beads').textContent='0';$('colorsCount').textContent='0';$('dimensions').textContent='—';$('colors').innerHTML='<span class="hint">生成图纸后显示颜色数量</span>';$('download').disabled=true};
</script></body></html>
